name: Deploy docs

# 每次把内容推到 main 就重新构建 Fumadocs 静态站并同步到服务器。
# 服务器上 nginx 直接从 /www/wwwroot/paperbell-docs/docs 提供 paperbell.cn/docs，
# 没有额外的重启动作，rsync 完成即生效。
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "!.github/workflows/deploy-docs.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建不同步（用来验证构建是否正常）"
        type: boolean
        default: false

# 同一分支只保留最后一次部署，避免连续推送时新旧产物互相覆盖
concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  # Fumadocs 站点目录与构建产物目录
  SITE_DIR: site
  BUILD_OUT: site/out

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出文档内容
        uses: actions/checkout@v4

      - name: 确认站点生成器存在
        run: |
          if [ ! -f "$SITE_DIR/package.json" ]; then
            echo "::error::找不到 $SITE_DIR/package.json。"
            echo "::error::Fumadocs 站点生成器还没提交进本仓库，CI 无法构建。"
            echo "::error::请把本地的 site/ 目录提交上来（注意 .gitignore 是白名单模式，需要放行 site/）。"
            exit 1
          fi

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 与本地验证通过的版本一致；Next 16 要求 >= 20.9
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.SITE_DIR }}/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: ${{ env.SITE_DIR }}
        run: pnpm install --frozen-lockfile

      - name: 生成内容并构建
        working-directory: ${{ env.SITE_DIR }}
        run: |
          pnpm content
          pnpm build

      - name: 校验构建产物
        run: |
          if [ ! -f "$BUILD_OUT/index.html" ]; then
            echo "::error::$BUILD_OUT/index.html 不存在，构建产物不完整，终止部署。"
            exit 1
          fi
          echo "产物文件数：$(find "$BUILD_OUT" -type f | wc -l)"

      - name: 配置部署密钥
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 同步到服务器
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"

          # 先传到同级的 .new，再在服务器上用一次 mv 换过去。
          #
          # 直接 rsync --delete 到线上目录不是原子的：同步进行到一半时，新的
          # HTML 可能已经就位、而它引用的 hash chunk 还没传完，或者旧 chunk
          # 已经被删掉。页面 HTML 是 no-cache 每次回源的，所以这个窗口真的会
          # 被访客撞上——表现就是一个完全没有样式的裸页面。
          #
          # 结尾的斜杠不能少，否则会在目标目录里多套一层 out/。
          rsync -az --delete -e "ssh $SSH_OPTS" \
            "$BUILD_OUT/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH.new/"

          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            # nginx 以 www 身份读，确保目录可进入、文件可读
            find '$DEPLOY_PATH.new' -type d -exec chmod 755 {} +
            find '$DEPLOY_PATH.new' -type f -exec chmod 644 {} +
            rm -rf '$DEPLOY_PATH.old'
            if [ -d '$DEPLOY_PATH' ]; then mv '$DEPLOY_PATH' '$DEPLOY_PATH.old'; fi
            mv '$DEPLOY_PATH.new' '$DEPLOY_PATH'
            rm -rf '$DEPLOY_PATH.old'
          "

      - name: 验证线上可访问
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          # 只看首页 200 是不够的：样式和脚本挂掉时页面照样返回 200，
          # 只是渲染成一个没有样式的裸页面。这里把首页引用的 _next 资源
          # 逐个取一遍，缺一个就判失败。
          fail=0
          for page in / /intro/ /guide/ /plugins/; do
            url="https://paperbell.cn/docs${page}"
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || fail=1
          done

          assets=$(grep -oE '(href|src)="/docs/_next/[^"]+"' /tmp/page.html \
                   | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "检查 $(echo "$assets" | wc -l) 个静态资源"
          for a in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://paperbell.cn$a")
            [ "$code" = "200" ] || { echo "缺失 $code $a"; fail=1; }
          done

          [ "$fail" = "0" ] || exit 1
          echo "页面与静态资源均可访问"
